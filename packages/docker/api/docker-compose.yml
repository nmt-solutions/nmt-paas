services:
  api:
    build:
      context: ../../..
      dockerfile: apps/api/docker/api.Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_APP_PORT: ${API_APP_PORT}
      API_KEY: ${API_KEY}

    networks:
      - app-network

networks:
  app-network:
    external: true
